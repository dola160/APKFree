<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ứng Dụng Của Tôi</title>

<!-- Bắt buộc: liên kết tới manifest.json để Chrome nhận diện đây là PWA -->
<link rel="manifest" href="manifest.json">

<!-- Icon hiển thị khi thêm vào màn hình chính (iOS + trình duyệt cũ) -->
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<!-- Màu thanh trạng thái -->
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ứng Dụng Của Tôi">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 { font-size: 26px; margin-bottom: 12px; }
  p { opacity: 0.9; line-height: 1.5; max-width: 420px; }
  .badge {
    margin-top: 24px;
    background: rgba(255,255,255,0.15);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
  }
  #install-btn {
    display: none;
    margin-top: 20px;
    background: #fff;
    color: #1a73e8;
    border: none;
    padding: 14px 28px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

  <h1>🚀 Ứng Dụng Của Tôi</h1>
  <p>Đây là ứng dụng web tiến bộ (PWA). Khi cài đặt trên Android qua Chrome,
     hệ thống sẽ tự động tạo <b>WebAPK thật</b> — có chữ ký hợp lệ,
     icon riêng, chạy toàn màn hình như app gốc, không lỗi cài đặt.</p>

  <button id="install-btn">📲 Cài đặt ứng dụng</button>
  <div class="badge" id="status">Đang kiểm tra Service Worker...</div>

<script>
  // Đăng ký Service Worker — bắt buộc để Chrome coi đây là PWA hợp lệ
  // và cho phép tạo WebAPK khi người dùng "Thêm vào Màn hình chính"
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => document.getElementById('status').textContent = '✅ Service Worker đã sẵn sàng')
      .catch(err => document.getElementById('status').textContent = '❌ Lỗi SW: ' + err);
  } else {
    document.getElementById('status').textContent = '⚠️ Trình duyệt không hỗ trợ Service Worker';
  }

  // Bắt sự kiện "beforeinstallprompt" để hiện nút Cài đặt tuỳ chỉnh
  let deferredPrompt;
  const installBtn = document.getElementById('install-btn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block';
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    console.log('Kết quả cài đặt:', outcome);
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });

  window.addEventListener('appinstalled', () => {
    document.getElementById('status').textContent = '🎉 Đã cài đặt thành công!';
  });
</script>

</body>
</html>
